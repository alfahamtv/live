        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:black;font-family:'Cairo',sans-serif;color:white;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
        .player-container{width:100%;background:black;flex-shrink:0;aspect-ratio:16/9;position:relative;}
        video, #youtubeIframe{width:100%;height:100%;background:black;outline:none;border:none;}
        
        .channels-container{background:#1a1a1a;flex-grow:1;padding:8px;overflow-y:auto;}
        .channels-grid{display:flex;flex-direction:column;gap:4px;}
        
        .channel-card{background:#2a2a2a;border-radius:6px;padding:8px 12px;cursor:pointer;border:1px solid #3a3a3a;color:white;font-size:14px;text-align:right;display:flex;align-items:center;gap:8px;}
        .channel-number{display:inline-flex;align-items:center;justify-content:center;background:#444;color:#fff;font-size:12px;font-weight:600;width:22px;height:22px;border-radius:4px;flex-shrink:0;}
        .channel-card:hover{background:#3a3a3a;}
        .channel-card.active{border-right:3px solid white;background:#3a3a3a;}
        .channel-card.active .channel-number{background:#e74c3c;}
        .channel-name{flex:1;}

        .quality-hq-btn {position: absolute;bottom: 65px;right: 10px;background: rgba(0,0,0,0.4);color: white;border: 1px solid rgba(255,255,255,0.1);border-radius: 4px;padding: 5px 12px;font-size: 12px;cursor: pointer;z-index: 1000;display: none;transition: opacity 0.3s;}
        
        #qualityMenu {position: absolute;bottom: 65px;right: 65px;background: rgba(0,0,0,0.7);border: 1px solid rgba(255,255,255,0.1);border-radius: 4px;display: none;z-index: 1000;min-width: 70px;}
        .quality-option {padding: 8px 12px;cursor: pointer;font-size: 12px;text-align: center;border-bottom: 1px solid rgba(255,255,255,0.1);display: flex;align-items: center;justify-content: center;gap: 5px;}
        .quality-option:hover {background: rgba(255,255,255,0.2);}
        
        .dot {width: 6px;height: 6px;background: #e74c3c;border-radius: 50%;display: none;}
        .quality-option.selected .dot {display: block;}
    </style>

        const playerContainer = document.getElementById('playerContainer');
        const video = document.getElementById('video');
        const list = document.getElementById('channelsList');
        const qualityBtn = document.getElementById('qualityHqBtn');
        const qualityMenu = document.getElementById('qualityMenu');
        let hls = null;
        let hideTimeout;

        function getYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function showControls() {
            if (qualityBtn.style.display !== 'none') {
                qualityBtn.style.opacity = '1';
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => { qualityBtn.style.opacity = '0'; }, 3000);
            }
        }

        function playChannel(url, card) {
            if (hls) { hls.destroy(); hls = null; }
            qualityMenu.style.display = 'none';
            qualityBtn.style.display = 'none';
            const existingIframe = document.getElementById('youtubeIframe');
            if (existingIframe) existingIframe.remove();

            document.querySelectorAll('.channel-card').forEach(e => e.classList.remove('active'));
            card.classList.add('active');

            const youtubeID = getYouTubeID(url);

            if (youtubeID) {
                video.style.display = 'none';
                const iframe = document.createElement('iframe');
                iframe.id = 'youtubeIframe';
                iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
                iframe.src = `https://www.youtube.com/embed/${youtubeID}?autoplay=1&playsinline=1`;
                playerContainer.appendChild(iframe);
            } else {
                video.style.display = 'block';
                if (Hls.isSupported() && url.includes('.m3u8')) {
                    hls = new Hls({xhrSetup: (xhr) => {xhr.setRequestHeader('Referer', 'https://www.google.com/');}});
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
                        if (data.levels.length > 1) {
                            qualityBtn.style.display = 'block';
                            updateQualityMenu(hls, hls.currentLevel);
                        }
                        video.play().catch(()=>{});
                    });
                } else { video.src = url; video.play().catch(()=>{}); }
            }
        }

        function updateQualityMenu(hlsInstance, selectedIndex) {
            qualityMenu.innerHTML = '';
            hlsInstance.levels.forEach((level, index) => {
                const opt = document.createElement('div');
                opt.className = 'quality-option' + (index === selectedIndex ? ' selected' : '');
                opt.innerHTML = `<span class="dot"></span> ${level.height}p`;
                opt.onclick = () => {
                    hlsInstance.currentLevel = index;
                    updateQualityMenu(hlsInstance, index);
                    qualityMenu.style.display = 'none';
                };
                qualityMenu.appendChild(opt);
            });
        }

        qualityBtn.onclick = () => { qualityMenu.style.display = (qualityMenu.style.display === 'block') ? 'none' : 'block'; };

        const lines = channelsData.trim().split('\n').filter(l => l.trim() !== "");
        for (let i = 0; i < lines.length; i += 2) {
            const name = lines[i].trim();
            const url = lines[i+1]?.trim();
            if (name && url) {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `<span class="channel-number">${(i/2) + 1}</span><span class="channel-name">${name}</span>`;
                card.onclick = () => playChannel(url, card);
                list.appendChild(card);
                if (i === 0) setTimeout(() => card.click(), 100);
            }
        }
